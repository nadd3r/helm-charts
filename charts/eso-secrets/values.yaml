secretStore:
  name: vault-backend
  spec:
    provider:
      vault:
        server: "http://my.vault.server:8200"
        path: "secret"
        version: "v2"
        auth:
          tokenSecretRef:
            name: "vault-token"
            key: "token"

clusterSecretStore:
  name: vault-backend
  spec:
    provider:
      vault:
        server: "http://my.vault.server:8200"
        path: "secret"
        version: "v2"
        auth:
          tokenSecretRef:
            name: "vault-token"
            key: "token"
