apiVersion: v1
kind: Secret
metadata:
  name: {{ include "searxng.fullname" . }}-secrets
data:
  SEARXNG_SECRET: {{ .Values.searxng.server.secretKey | b64enc }}
{{- if and .Values.searxng.server.limiter (and (not .Values.searxng.valkey.url) (not .Values.valkey.auth.enabled)) }}
  SEARXNG_VALKEY_URL: {{ printf "valkey://%s-valkey:6379/0" (include "searxng.fullname" . ) | b64enc }}
{{- else if and .Values.searxng.server.limiter (and (.Values.searxng.valkey.url) (not .Values.valkey.auth.enabled) )}}
  SEARXNG_VALKEY_URL: {{ .Values.searxng.valkey.url | b64enc }}
{{- end }}