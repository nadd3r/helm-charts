{{- if and .Values.auth.basicAuthMode (not .Values.auth.basicAuthUser.existingSecret.name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sillytavern.fullname" . }}-basicauth-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sillytavern.labels" . | nindent 4 }}
type: Opaque
data:
  SILLYTAVERN_BASICAUTHUSER_USERNAME: {{ .Values.auth.basicAuthUser.usernameKey | b64enc | quote }}
  SILLYTAVERN_BASICAUTHUSER_PASSWORD: {{ .Values.auth.basicAuthUser.passwordKey | b64enc | quote }}
{{- end }}

{{- if and .Values.config.enableUserAccounts (not .Values.auth.adminUserPassword.existingSecret.name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sillytavern.fullname" . }}-admin-password
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sillytavern.labels" . | nindent 4 }}
type: Opaque
data:
  DEFAULT_USER_PASSWORD: {{ .Values.auth.adminUserPassword.password | b64enc | quote }}
{{- end }}