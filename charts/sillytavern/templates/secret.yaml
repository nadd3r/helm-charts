{{- if (include "sillytavern.secretNeeded" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sillytavern.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sillytavern.labels" . | nindent 4 }}
type: Opaque
data:
  {{- /* Default user password */}}
  {{- if and (not .Values.sillytavern.defaultUser.existingSecret.name) .Values.sillytavern.enableUserAccounts }}
  DEFAULT_USER_PASSWORD: {{ .Values.sillytavern.defaultUser.password | b64enc | quote }}
  {{- end }}
  {{- /* Basic auth password */}}
  {{- if and (not .Values.sillytavern.basicAuthUser.existingSecret.name) .Values.sillytavern.basicAuthMode }}
  SILLYTAVERN_BASICAUTHUSER_USERNAME: {{ .Values.sillytavern.basicAuthUser.username | b64enc | quote }}
  SILLYTAVERN_BASICAUTHUSER_PASSWORD: {{ .Values.sillytavern.basicAuthUser.password | b64enc | quote }}
  {{- end }}
{{- end }}