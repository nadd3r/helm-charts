
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "sillytavern.fullname" . }}-env
  namespace: {{ .Release.Namespace }}
data:
  SILLYTAVERN_BROWSER_LAUNCH: "false"
  SILLYTAVERN_LISTEN: "true"
  SILLYTAVERN_HOSTWHITELIST_ENABLED: "true"
  SILLYTAVERN_THUMBNAILS_DIMESIONS: '{ "bg": [160, 90], "avatar": [96, 144], "persona": [96, 144] }'
  {{- if .Values.ingress.enabled }}
  SILLYTAVERN_HOSTWHITELIST_HOSTS: '["{{ (index .Values.ingress.hosts 0 "host") }}"]'
  {{- end }}
  {{- if .Values.httpRoute.enabled }}
  SILLYTAVERN_HOSTWHITELIST_HOSTS: '["{{ (index .Values.httpRoute.hostnames 0) }}"]'
  {{- end }}
  {{- include "sillytavern.env" (dict "root" . "values" .Values.config) | indent 2 }}