name: Release Helm Charts

on:
  push:
    branches:
      - main
    paths:
      - "charts/**"
      - ".github/workflows/release-charts.yaml"
      - ".github/scripts/detect-changed-charts.sh"

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect charts with a version bump
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history is required so Chart.yaml can be diffed against
          # the previous commit on main.
          fetch-depth: 0

      - name: Install yq
        env:
          YQ_VERSION: v4.45.4
        run: |
          sudo curl -fsSL "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Detect changed charts
        id: detect
        run: .github/scripts/detect-changed-charts.sh "${{ github.event.before }}" "${{ github.sha }}"

  release:
    name: Package, sign, and push ${{ matrix.name }}
    needs: detect-changes
    if: needs.detect-changes.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push chart + signature to ghcr.io
      id-token: write # mint OIDC token for Cosign keyless signing
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Set registry coordinates
        id: coords
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          REPO="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          echo "owner=${OWNER}" >> "$GITHUB_OUTPUT"
          echo "repo=${REPO}" >> "$GITHUB_OUTPUT"
          echo "oci_repo=oci://ghcr.io/${OWNER}/${REPO}" >> "$GITHUB_OUTPUT"
          echo "chart_ref=ghcr.io/${OWNER}/${REPO}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - name: Package chart
        run: |
          set -euo pipefail
          mkdir -p dist
          if grep -qE '^dependencies:' "${{ matrix.path }}/Chart.yaml"; then
            helm dependency update "${{ matrix.path }}"
          fi
          helm package "${{ matrix.path }}" --destination dist
          ls -l dist

      - name: Log in to GHCR (Helm)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Log in to GHCR (Cosign)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Push chart to GHCR
        id: push
        run: |
          set -euo pipefail
          PACKAGE_PATH="dist/${{ matrix.name }}-${{ matrix.version }}.tgz"
          if [[ ! -f "${PACKAGE_PATH}" ]]; then
            echo "::error::Expected package ${PACKAGE_PATH} was not produced by helm package"
            exit 1
          fi
          OUTPUT="$(helm push "${PACKAGE_PATH}" "${{ steps.coords.outputs.oci_repo }}" 2>&1 | tee /dev/stderr)"
          DIGEST="$(echo "${OUTPUT}" | awk '/^Digest:/{print $2}')"
          if [[ -z "${DIGEST}" ]]; then
            echo "::error::Failed to parse digest from helm push output"
            exit 1
          fi
          REF="${{ steps.coords.outputs.chart_ref }}@${DIGEST}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (keyless)
        run: cosign sign --yes "${{ steps.push.outputs.ref }}"

      - name: Verify keyless signature
        run: |
          cosign verify \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release-charts.yaml@refs/heads/main" \
            "${{ steps.push.outputs.ref }}"

      - name: Summary
        run: |
          {
            echo "### Published \`${{ matrix.name }}\` v${{ matrix.version }}"
            echo
            echo "- OCI: \`oci://${{ steps.coords.outputs.chart_ref }}\`"
            echo "- Digest: \`${{ steps.push.outputs.digest }}\`"
            echo "- Signed: Cosign keyless (GitHub OIDC / Fulcio / Rekor)"
            echo
            echo "Install:"
            echo
            echo '```bash'
            echo "helm install ${{ matrix.name }} oci://${{ steps.coords.outputs.chart_ref }} --version ${{ matrix.version }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
