name: Release Helm Charts

on:
  push:
    branches:
      - main
    paths:
      - "charts/**"

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect charts with a version bump
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need history so we can diff Chart.yaml against the previous commit.
          fetch-depth: 0

      - name: Install yq
        run: |
          sudo curl -sSL https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Detect changed charts
        id: detect
        run: .github/scripts/detect-changed-charts.sh "${{ github.event.before }}" "${{ github.sha }}"

  release:
    name: Build, sign, and publish charts
    needs: detect-changes
    if: needs.detect-changes.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # mint OIDC token for keyless cosign signing
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set lowercase registry namespace
        id: owner
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Package chart
        run: |
          mkdir -p .cr-release-packages
          helm package "${{ matrix.path }}" --destination .cr-release-packages

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Push chart to GHCR
        id: push
        run: |
          set -euo pipefail
          PACKAGE_PATH=$(ls .cr-release-packages/${{ matrix.name }}-*.tgz)
          OUTPUT=$(helm push "$PACKAGE_PATH" "oci://ghcr.io/${{ steps.owner.outputs.owner }}/charts" 2>&1 | tee /dev/stderr)
          DIGEST=$(echo "$OUTPUT" | grep -oP 'Digest:\s*\Ksha256:[a-f0-9]+')
          REF="ghcr.io/${{ steps.owner.outputs.owner }}/charts/${{ matrix.name }}@${DIGEST}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign chart (keyless)
        run: cosign sign --yes "${{ steps.push.outputs.ref }}"

      - name: Summary
        run: |
          echo "### Published ${{ matrix.name }} v${{ matrix.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ref: \`${{ steps.push.outputs.ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Signed with cosign (keyless/OIDC)" >> "$GITHUB_STEP_SUMMARY"
